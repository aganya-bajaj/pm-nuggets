name: Nightly reminder

on:
  schedule:
    - cron: "30 17 * * *"   # 17:30 UTC = 11:00 PM IST
  workflow_dispatch: {}     # "Run workflow" button for a manual test

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --omit=dev || npm install web-push@3.6.7
      - name: Send push
        env:
          VAPID_PUBLIC_KEY: BIrsJbLqvQVZYTgOFl-v67xLPxj_b-SDyDZeuAUU81dTTK4b2bd5lOqlrJBb8X88KngMfpMDumVYhMA4tebjcRI
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
        run: node scripts/send.js
      # GitHub pauses scheduled jobs after 60 days without repo activity.
      # A tiny monthly commit keeps the reminder running.
      - name: Keep schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 40*86400 )) ]; then
            git config user.name "pm-nuggets-bot"
            git config user.email "pm-nuggets-bot@users.noreply.github.com"
            date -u > .keepalive && git add .keepalive
            git commit -m "Keep nightly reminder active" && git push
          fi
